[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-project"
version = "0.1.0"
description = "SIPL grammar and typed AST parser"
requires-python = ">=3.10"
dependencies = ["lark>=1.1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools.package-data]
sipl = ["grammar.lark"]
