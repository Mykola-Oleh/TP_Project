name: SIPL CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -v
      - name: Run SIPL conformance suite
        run: python conformance/run_suite.py

  quality-and-build:
    name: Lint, type-check and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" ruff mypy build
      - name: Lint for syntax and undefined names
        run: python -m ruff check src tests conformance --select E4,E7,E9,F63,F7,F82
      - name: Check Python type annotations (non-blocking baseline)
        run: python -m mypy src/sipl --ignore-missing-imports --follow-imports=skip --check-untyped-defs --no-incremental
        continue-on-error: true
      - name: Build distribution packages
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sipl-dist
          path: dist/*
